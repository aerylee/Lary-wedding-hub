# Supabase CLI configuration for local development (`supabase start`).
# Hosted projects are configured in the dashboard — see docs/DEPLOY.md for the settings
# that must match these.
project_id = "lary-wedding-hub"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://localhost:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.rate_limit]
# magic links per hour, per project — keeps the endpoint from being an email cannon
email_sent = 30

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
otp_length = 6
otp_expiry = 3600
max_frequency = "30s"

[functions.assistant]
verify_jwt = true

[functions.autofill]
verify_jwt = true

[functions.send-invite]
verify_jwt = true

[functions.fx-refresh]
verify_jwt = true

[functions.purge-attachments]
verify_jwt = true
